<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Your Favorite Rapper & Album</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 0.8s ease-in;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a8a8a8;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-in;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .page.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 0 auto;
            max-width: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.1);
            border-color: #4ecdc4;
            box-shadow: 0 10px 40px rgba(78, 205, 196, 0.3);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .card-caption {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            margin-top: 0.5rem;
        }

        .back-button {
            display: inline-block;
            margin-top: 3rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        .confirmation {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .confirmation.active {
            display: block;
        }

        .confirmation-message {
            font-size: 2rem;
            margin: 2rem 0;
            padding: 2rem;
            background: rgba(78, 205, 196, 0.1);
            border-radius: 20px;
            border: 2px solid #4ecdc4;
        }

        .album-display {
            margin: 2rem auto;
            max-width: 400px;
        }

        .album-display img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page 1: Rapper Selection -->
        <div id="rapper-page" class="page active">
            <h1>🎧 Pick Your Favorite Rapper</h1>
            <p class="subtitle">Choose an artist to explore their albums</p>

            <div class="grid" id="rapper-grid">
                <div class="card" onclick="showAlbums('travis')">
                    <div class="card-image">
                        <img src="images/travis.webp" alt="Travis Scott" onerror="this.style.display='none'; this.parentElement.innerHTML='Travis Scott'">
                    </div>
                    <div class="card-caption">Travis Scott</div>
                </div>

                <div class="card" onclick="showAlbums('drake')">
                    <div class="card-image">
                        <img src="images/drake.jpg" alt="Drake" onerror="this.style.display='none'; this.parentElement.innerHTML='Drake'">
                    </div>
                    <div class="card-caption">Drake</div>
                </div>

                <div class="card" onclick="showAlbums('kanye')">
                    <div class="card-image">
                        <img src="images/Kanye.png" alt="Kanye West" onerror="this.style.display='none'; this.parentElement.innerHTML='Kanye West'">
                    </div>
                    <div class="card-caption">Kanye West</div>
                </div>

                <div class="card" onclick="showAlbums('kendrick')">
                    <div class="card-image">
                        <img src="images/kendrick.jpeg" alt="Kendrick Lamar" onerror="this.style.display='none'; this.parentElement.innerHTML='Kendrick Lamar'">
                    </div>
                    <div class="card-caption">Kendrick Lamar</div>
                </div>
            </div>
        </div>

        <!-- Page 2: Album Selection -->
        <div id="album-page" class="page">
            <h1 id="album-page-title">Choose Your Album</h1>
            <p class="subtitle" id="album-page-subtitle"></p>

            <div class="grid" id="album-grid">
                <!-- Albums will be dynamically inserted here -->
            </div>

            <button class="back-button" onclick="backToRappers()">← Back to Rappers</button>
        </div>

        <!-- Confirmation Page -->
        <div id="confirmation-page" class="page">
            <h1>🎉 Great Choice!</h1>

            <div class="confirmation-message" id="confirmation-message">
                <!-- Confirmation message will be inserted here -->
            </div>

            <div class="album-display" id="selected-album-display">
                <!-- Selected album image will be displayed here -->
            </div>

            <button class="back-button" onclick="backToRappers()">← Choose Another</button>
        </div>
    </div>

    <script>
        // Album data structure
        const rappers = {
            travis: {
                name: "Travis Scott",
                albums: [
                    { name: "Astroworld", image: "images/Travis_Scott_-_Astroworld.png" },
                    { name: "Rodeo", image: "images/rodeo.webp" },
                    { name: "Utopia", image: "images/utopia.jpg" }
                ]
            },
            drake: {
                name: "Drake",
                albums: [
                    { name: "Take Care", image: "images/takecare.jpeg" },
                    { name: "Scorpion", image: "images/Scorpion_by_Drake.jpg" },
                    { name: "Views", image: "images/views.jpeg" }
                ]
            },
            kanye: {
                name: "Kanye West",
                albums: [
                    { name: "Graduation", image: "images/Graduation.jpeg" },
                    { name: "Donda", image: "images/Donda.jpg" },
                    { name: "The College Dropout", image: "images/college-dropout.webp" }
                ]
            },
            kendrick: {
                name: "Kendrick Lamar",
                albums: [
                    { name: "DAMN.", image: "images/Damn.jpeg" },
                    { name: "To Pimp a Butterfly", image: "images/Butterfly.jpg" },
                    { name: "Mr. Morale & The Big Steppers", image: "images/Mr.Morale.jpeg" }
                ]
            }
        };

        let currentRapper = null;

        function showAlbums(rapperId) {
            currentRapper = rapperId;
            const rapper = rappers[rapperId];

            // Update page title
            document.getElementById('album-page-title').textContent = `Choose Your ${rapper.name} Album`;
            document.getElementById('album-page-subtitle').textContent = `Select your favorite ${rapper.name} album`;

            // Generate album cards
            const albumGrid = document.getElementById('album-grid');
            albumGrid.innerHTML = '';

            rapper.albums.forEach(album => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectAlbum(album.name, album.image);

                card.innerHTML = `
                    <div class="card-image">
                        <img src="${album.image}" alt="${album.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='${album.name}'">
                    </div>
                    <div class="card-caption">${album.name}</div>
                `;

                albumGrid.appendChild(card);
            });

            // Show album page
            switchPage('album-page');
        }

        function selectAlbum(albumName, albumImage) {
            const rapper = rappers[currentRapper];

            // Update confirmation message
            document.getElementById('confirmation-message').innerHTML = `
                You chose <strong>${albumName}</strong> by <strong>${rapper.name}</strong>!
            `;

            // Display selected album cover
            document.getElementById('selected-album-display').innerHTML = `
                <img src="${albumImage}" alt="${albumName}" onerror="this.style.display='none'">
            `;

            // Show confirmation page
            switchPage('confirmation-page');
        }

        function backToRappers() {
            switchPage('rapper-page');
            currentRapper = null;
        }

        function switchPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Show selected page
            document.getElementById(pageId).classList.add('active');

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
